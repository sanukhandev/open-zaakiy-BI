# Local development infrastructure; Azure models and OCR are external managed services.
name: zaakiy-bi

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaakiy_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zaakiy
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01-create-n8n-db.sh:/docker-entrypoint-initdb.d/01-create-n8n-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaakiy_admin -d zaakiy -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-Asia/Dubai}
      GENERIC_TIMEZONE: ${TZ:-Asia/Dubai}
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      # Only for local development over HTTP; use TLS and secure cookies in deployment.
      N8N_SECURE_COOKIE: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  n8n-runner:
    image: n8nio/runners:2.45.7
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}
    depends_on:
      n8n:
        condition: service_started
    networks: [backend]

  # Single-node S3 for LOCAL DEVELOPMENT. Use managed object storage in production.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: zaakiy-documents
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?Set SEAWEEDFS_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - documents_data:/data
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  documents_data:
