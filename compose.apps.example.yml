# OPTIONAL example overlay: requires API, LangGraph, and worker images built elsewhere.
# Only start once those images exist and app routes are implemented.
# docker compose -f docker-compose.yml -f compose.apps.example.yml up -d
services:
  api:
    image: ${ZAAKIY_API_IMAGE:-zaakiy-api:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: '3000'
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: zaakiy
      PGUSER: zaakiy_app
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      AGENT_URL: http://agent:8000
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: zaakiy-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on:
      postgres: {condition: service_healthy}
      agent: {condition: service_started}
      seaweedfs: {condition: service_started}
    networks: [backend]

  agent:
    image: ${ZAAKIY_AGENT_IMAGE:-zaakiy-agent:local}
    restart: unless-stopped
    expose: ['8000']
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: zaakiy
      PGUSER: zaakiy_app
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:?Set AZURE_FOUNDRY_ENDPOINT}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:?Set AZURE_FOUNDRY_API_KEY}
      AZURE_FOUNDRY_CHAT_DEPLOYMENT: ${AZURE_FOUNDRY_CHAT_DEPLOYMENT:?Set AZURE_FOUNDRY_CHAT_DEPLOYMENT}
      AZURE_FOUNDRY_EMBEDDING_DEPLOYMENT: ${AZURE_FOUNDRY_EMBEDDING_DEPLOYMENT:?Set AZURE_FOUNDRY_EMBEDDING_DEPLOYMENT}
      EMBEDDING_DIMENSIONS: '3072'
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]

  worker:
    image: ${ZAAKIY_WORKER_IMAGE:-zaakiy-worker:local}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: zaakiy
      PGUSER: zaakiy_app
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: zaakiy-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      DOCUMENT_INTELLIGENCE_ENDPOINT: ${DOCUMENT_INTELLIGENCE_ENDPOINT:?Set DOCUMENT_INTELLIGENCE_ENDPOINT}
      DOCUMENT_INTELLIGENCE_KEY: ${DOCUMENT_INTELLIGENCE_KEY:?Set DOCUMENT_INTELLIGENCE_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_started}
    networks: [backend]
